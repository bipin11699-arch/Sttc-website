
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ST&TC Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f6fb;
}

.header{
  background:#0756a5;
  color:white;
  padding:20px 15px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:25px;
}

.header p{
  margin:6px 0 0;
}

.container{
  max-width:600px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:18px;
  border-radius:14px;
  box-shadow:0 3px 12px #0002;
}

h2{
  color:#0756a5;
  margin-top:0;
}

input[type=file]{
  width:100%;
  padding:12px;
  margin:8px 0 10px;
  border:1px solid #ddd;
  border-radius:8px;
  background:#fafafa;
}

button{
  width:100%;
  background:#0756a5;
  color:white;
  border:0;
  padding:13px;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  margin-top:8px;
}

button.delete{
  background:#d93025;
}

.preview{
  display:none;
  width:100%;
  max-height:300px;
  object-fit:contain;
  margin:12px 0;
  border-radius:10px;
  border:1px solid #ddd;
}

.status{
  margin-top:10px;
  padding:10px;
  background:#eef7ee;
  color:#176b17;
  border-radius:8px;
  font-size:14px;
}

.info{
  background:#fff8df;
  padding:12px;
  border-radius:8px;
  margin-top:10px;
  font-size:14px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="header">
  <h1>ST&TC Admin Panel</h1>
  <p>Shubham Test & Training Centre</p>
</div>

<div class="container">

  <!-- LOGO -->
  <div class="card">
    <h2>🖼️ Change Logo</h2>

    <input type="file" id="logoInput" accept="image/*">

    <img id="logoPreview" class="preview">

    <button onclick="previewOnly('logoInput','logoPreview')">
      Preview Logo
    </button>

    <div class="info">
      Logo अभी Firebase में upload नहीं होगा।
      पहले Requirement system को चालू करते हैं।
    </div>
  </div>


  <!-- ADVERTISEMENT -->
  <div class="card">
    <h2>📢 Advertisement</h2>

    <input type="file" id="adInput" accept="image/*">

    <img id="adPreview" class="preview">

    <button onclick="previewOnly('adInput','adPreview')">
      Preview Advertisement
    </button>

    <div class="info">
      Advertisement का Firebase upload बाद में जोड़ सकते हैं।
    </div>
  </div>


  <!-- REQUIREMENTS -->
  <div class="card">
    <h2>📋 Company Requirements</h2>

    <div id="requirements"></div>

  </div>

</div>


<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL,
  deleteObject
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


const firebaseConfig = {
  apiKey: "AIzaSyAoO-SZ2Gf8ZmVCmipJk_Nk_eqj0Jfvj8Q",
  authDomain: "sttc-e9997.firebaseapp.com",
  projectId: "sttc-e9997",
  storageBucket: "sttc-e9997.firebasestorage.app",
  messagingSenderId: "52519358254",
  appId: "1:52519358254:web:e8caef95acd2b8f90f34bf",
  measurementId: "G-X19EVTMSJP"
};

const app = initializeApp(firebaseConfig);
const storage = getStorage(app);


function createRequirements(){

  const container =
    document.getElementById("requirements");

  for(let i=1;i<=10;i++){

    const box=document.createElement("div");

    box.className="card";

    box.innerHTML=`

      <h2>Requirement ${i}</h2>

      <input
        type="file"
        id="requirement${i}"
        accept="image/*"
      >

      <img
        id="preview${i}"
        class="preview"
      >

      <button
        onclick="previewRequirement(${i})">
        👁️ Preview
      </button>

      <button
        onclick="uploadRequirement(${i})">
        ☁️ Upload Requirement ${i}
      </button>

      <button
        class="delete"
        onclick="deleteRequirement(${i})">
        🗑️ Delete
      </button>

      <div
        id="status${i}"
        class="status">
        Ready
      </div>

    `;

    container.appendChild(box);
  }
}


window.previewRequirement=function(i){

  const input=document.getElementById(
    "requirement"+i
  );

  const preview=document.getElementById(
    "preview"+i
  );

  const file=input.files[0];

  if(!file){
    alert("पहले Requirement "+i+" की फोटो चुनें।");
    return;
  }

  preview.src=URL.createObjectURL(file);
  preview.style.display="block";
};


window.uploadRequirement=async function(i){

  const input=document.getElementById(
    "requirement"+i
  );

  const status=document.getElementById(
    "status"+i
  );

  const file=input.files[0];

  if(!file){
    alert("पहले Requirement "+i+" की फोटो चुनें।");
    return;
  }

  try{

    status.innerText="Uploading...";

    const fileRef=ref(
      storage,
      "requirements/requirement"+i+".jpg"
    );

    await uploadBytes(fileRef,file);

    const url=await getDownloadURL(fileRef);

    localStorage.setItem(
      "requirement"+i,
      url
    );

    status.innerText="✅ Requirement "+i+" uploaded successfully";

    alert(
      "Requirement "+i+" Firebase Storage में upload हो गया।"
    );

  }catch(error){

    console.error(error);

    status.innerText="❌ Upload failed";

    alert(
      "Upload नहीं हुआ। Firebase Storage Rules check करें।"
    );
  }

};


window.deleteRequirement=async function(i){

  if(!confirm(
    "क्या आप Requirement "+i+" delete करना चाहते हैं?"
  )){
    return;
  }

  try{

    const fileRef=ref(
      storage,
      "requirements/requirement"+i+".jpg"
    );

    await deleteObject(fileRef);

    localStorage.removeItem(
      "requirement"+i
    );

    document.getElementById(
      "preview"+i
    ).style.display="none";

    document.getElementById(
      "status"+i
    ).innerText="Deleted";

    alert(
      "Requirement "+i+" delete हो गया।"
    );

  }catch(error){

    console.error(error);

    alert(
      "File नहीं मिली या delete permission नहीं है।"
    );
  }

};


window.previewOnly=function(inputId,previewId){

  const input=document.getElementById(inputId);
  const preview=document.getElementById(previewId);

  if(!input.files[0]){
    alert("पहले image चुनें।");
    return;
  }

  preview.src=URL.createObjectURL(input.files[0]);
  preview.style.display="block";
};


createRequirements();

</script>

</body>
</html>
